name: Mac test

# Runs the macOS build on a real Mac and saves screenshots of it, for when
# there is no Mac to hand. It takes the .dmg from a finished Release run
# instead of building again.

on:
  push:
    branches: [mac-test]
  workflow_dispatch:
    inputs:
      run:
        description: Release run to take the .dmg from (empty for the latest)
        required: false

jobs:
  test:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the .dmg
        run: |
          run="${{ inputs.run }}"
          if [ -z "$run" ]; then
            run=$(gh run list --workflow release.yml --limit 30 --json databaseId,conclusion,createdAt               -q '[.[] | select(.conclusion == "success")] | sort_by(.createdAt) | last | .databaseId')
          fi
          echo "Release run $run"
          gh run download "$run" -n macos -D dmg
          ls -lh dmg

      - name: Install it
        run: |
          hdiutil attach dmg/*.dmg -nobrowse -mountpoint /Volumes/pdfview-test
          ls -la /Volumes/pdfview-test
          cp -R /Volumes/pdfview-test/pdfview.app "$HOME/pdfview.app"
          hdiutil detach /Volumes/pdfview-test
          mkdir -p out
          {
            echo "== architectures"; lipo -info "$HOME/pdfview.app/Contents/MacOS/pdfview"
            echo "== signature";     codesign -dv --verbose=2 "$HOME/pdfview.app" 2>&1 || true
            echo "== verify";        codesign --verify --deep --strict "$HOME/pdfview.app" 2>&1 || true
            echo "== gatekeeper";    spctl -a -vv "$HOME/pdfview.app" 2>&1 || true
            echo "== document types"; plutil -p "$HOME/pdfview.app/Contents/Info.plist"
          } | tee out/bundle.txt

      # The way Finder does it: the file arrives as an open-document event, not
      # as an argument.
      - name: Open a PDF the way Finder does
        run: |
          open -a "$HOME/pdfview.app" --env PDFVIEW_TRACE=1 --stderr "$PWD/out/trace.log" "$PWD/docs/sample.pdf"
          sleep 12
          screencapture -x out/1-opened.png
          pgrep -lf pdfview.app | tee out/processes-1.txt

      # For the README: the two-page spread, as a picture of the window alone.
      - name: Screenshot of the window
        run: |
          keys() { osascript -e "tell application \"System Events\" to $1" 2>&1 || true; sleep 1; }
          osascript -e 'tell application "pdfview" to activate' || true
          sleep 1
          keys 'keystroke "d"'
          keys 'keystroke "0"'
          keys 'key code 121'
          sleep 2
          screencapture -x out/3-spread-screen.png
          cat > winid.swift <<'SWIFT'
          import CoreGraphics
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as! [[String: Any]]
          for w in list where (w["kCGWindowOwnerName"] as? String) == "pdfview" && (w["kCGWindowLayer"] as? Int) == 0 {
            print(w["kCGWindowNumber"]!)
            break
          }
          SWIFT
          id=$(swift winid.swift || true)
          echo "window id: $id"
          [ -n "$id" ] && screencapture -x -l "$id" out/3-spread-window.png || true
          system_profiler SPDisplaysDataType | grep -i resolution || true

      - name: Open a second PDF in the running app
        run: |
          open -a "$HOME/pdfview.app" "$PWD/docs/INTERNALS.pdf"
          sleep 8
          screencapture -x out/2-second-window.png
          pgrep -lf pdfview.app | tee out/processes-2.txt

      - name: State and logs
        if: always()
        run: |
          cat out/trace.log 2>/dev/null || echo "no trace log"
          cat "$HOME/.pdfview/state.json" 2>/dev/null | tee out/state.json || echo "no state file"
          ls "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | grep -i pdfview || echo "no crash reports"
          cp "$HOME/Library/Logs/DiagnosticReports"/pdfview* out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test
          path: out
