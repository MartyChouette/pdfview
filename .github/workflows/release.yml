name: Release

# Push a tag like v1.0.0 and this builds both downloads and publishes the
# release. Run it by hand from the Actions tab to just check that it builds.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '0.0.0-dev'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building $version"

      # Each package is a folder holding dist\ plus the loose scripts, which is
      # the shape install.cmd expects to find itself in.
      - name: Build both packages
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $flavours = @(
            @{ Suffix = '';           SelfContained = 'true'  }
            @{ Suffix = '-framework'; SelfContained = 'false' }
          )
          foreach ($f in $flavours) {
            $package = "package/win-x64$($f.Suffix)"
            $dist = "$package/dist"

            dotnet publish src/PdfView/PdfView.csproj -c Release -r win-x64 `
              --self-contained $f.SelfContained -p:Version=$v -o $dist
            if ($LASTEXITCODE -ne 0) { throw "app build failed$($f.Suffix)" }

            dotnet publish src/PdfThumb/PdfThumb.csproj -c Release `
              -p:Version=$v -o "$dist/thumbnail"
            if ($LASTEXITCODE -ne 0) { throw "thumbnail build failed$($f.Suffix)" }

            Get-ChildItem $dist -Recurse -Filter *.pdb | Remove-Item -Force
            Copy-Item install.cmd, uninstall.cmd, LICENSE, THIRD-PARTY-NOTICES.md $package

            Compress-Archive -Path "$package/*" -CompressionLevel Optimal `
              -DestinationPath "pdfview-$v-win-x64$($f.Suffix).zip"
          }
          Get-ChildItem *.zip | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: '*.zip'

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          draft: true
          generate_release_notes: true
