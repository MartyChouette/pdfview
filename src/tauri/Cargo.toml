[package]
name = "pdfview"
version = "1.0.0"
description = "A lightweight PDF reader"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
percent-encoding = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
